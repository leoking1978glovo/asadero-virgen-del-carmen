    <!-- ============================================================
         AGENTE DE IA (RELEVANCE AI) - BURBUJA DE CHAT
         Agente: asistente de pedidos del asador
         Color: burdeos #792108 | Sin pasos internos visibles
         Conversacion nueva en cada visita (sin historial)
         ============================================================ -->

    <!-- 1. BLOQUEAR GUARDADO DE CONVERSACIONES (sessionStorage) -->
    <script>
      (function () {
        var originalSetItem = sessionStorage.setItem;
        var originalGetItem = sessionStorage.getItem;
        var originalRemoveItem = sessionStorage.removeItem;
        
        sessionStorage.setItem = function(key, value) {
          if (/relevance|chat|conversation|92510f70/i.test(key)) {
            return;
          }
          return originalSetItem.apply(this, arguments);
        };
        
        sessionStorage.getItem = function(key) {
          if (/relevance|chat|conversation|92510f70/i.test(key)) {
            return null;
          }
          return originalGetItem.apply(this, arguments);
        };
        
        sessionStorage.removeItem = function(key) {
          if (/relevance|chat|conversation|92510f70/i.test(key)) {
            return;
          }
          return originalRemoveItem.apply(this, arguments);
        };
      })();
    </script>

    <!-- 2. OCULTAR "GREETING CONVERSATION" (subtítulo) -->
    <script>
      window.addEventListener("load", function () {
        var hideGreeting = function () {
          var chatIframe = document.querySelector('iframe[src*="relevanceai"]');
          if (chatIframe && chatIframe.contentDocument) {
            try {
              var iframeDoc = chatIframe.contentDocument;
              var elements = iframeDoc.querySelectorAll('*');
              for (var i = 0; i < elements.length; i++) {
                var el = elements[i];
                if (el.textContent && el.textContent.trim() === 'Greeting Conversation') {
                  el.style.display = 'none';
                }
              }
            } catch (e) {
              console.log('No se pudo acceder al iframe del chat');
            }
          }
          
          document.querySelectorAll('*').forEach(function (el) {
            if (el.textContent && el.textContent.trim() === 'Greeting Conversation') {
              el.style.display = 'none';
            }
          });
        };
        
        setTimeout(hideGreeting, 1000);
        setTimeout(hideGreeting, 3000);
        setTimeout(hideGreeting, 5000);
        
        var observer = new MutationObserver(hideGreeting);
        observer.observe(document.body, { childList: true, subtree: true });
      });
    </script>

    <!-- 3. BURBUJA DEL AGENTE DE RELEVANCE AI -->
    <script
      defer
